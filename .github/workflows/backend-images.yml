name: Build & Publish Backend Images
on:
    push:
        branches:
            - master
        paths:
            - "python/**"
            - "settings.default.jsonc"
            - ".github/workflows/backend-images.yml"
    workflow_dispatch:
permissions:
    contents: read
    packages: write
jobs:
    build-and-push:
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                include:
                    - name: bot-api
                      dockerfile: python/bot/Dockerfile
                      build_args: |
                          BOT_REQUIREMENTS_FILE=requirements.api.txt
                    - name: bot-discord
                      dockerfile: python/bot/Dockerfile
                      build_args: |
                          BOT_REQUIREMENTS_FILE=requirements.discord.txt
                    - name: worker
                      dockerfile: python/worker/Dockerfile
                      build_args: ""
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Set up Buildx
              uses: docker/setup-buildx-action@v3

            - name: Log in to GHCR
              uses: docker/login-action@v3
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Extract metadata (tags, labels)
              id: meta
              uses: docker/metadata-action@v5
              with:
                  images: |
                      ghcr.io/${{ github.repository_owner }}/discordclipsaver-${{ matrix.name }}
                  tags: |
                      type=raw,value=latest
                      type=sha

            # db-schema reuses the worker image (same Dockerfile, different command),
            # so only three images are built: bot-api, bot-discord, worker.
            - name: Build and push
              uses: docker/build-push-action@v6
              with:
                  context: .
                  file: ${{ matrix.dockerfile }}
                  push: true
                  build-args: ${{ matrix.build_args }}
                  tags: ${{ steps.meta.outputs.tags }}
                  labels: ${{ steps.meta.outputs.labels }}
                  cache-from: type=gha,scope=${{ matrix.name }}
                  cache-to: type=gha,mode=max,scope=${{ matrix.name }}

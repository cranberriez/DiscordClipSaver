services:
    traefik:
        image: traefik
        container_name: dcs-traefik
        command:
            - --api.dashboard=true
            - --providers.docker=true
            - --providers.docker.exposedbydefault=false
            - --entrypoints.web.address=:80
            - --entrypoints.websecure.address=:443
            - --entrypoints.dashboard.address=:8082 # Dedicated dashboard port
        ports:
            - "80:80"
            - "443:443"
            - "127.0.0.1:8082:8082" # Bind dashboard port to localhost only
        volumes:
            - /var/run/docker.sock:/var/run/docker.sock:ro
            - traefik_letsencrypt:/letsencrypt
        labels:
            - traefik.enable=true
            # Dashboard Router (simpler, no TLS)
            - traefik.http.routers.dashboard.rule=PathPrefix(`/dashboard`)
            - traefik.http.routers.dashboard.service=api@internal
            - traefik.http.routers.dashboard.entrypoints=dashboard
            - traefik.http.routers.dashboard.middlewares=auth,strip-dashboard

            # Middleware: Strip the /dashboard prefix before forwarding
            - traefik.http.middlewares.strip-dashboard.stripprefix.prefixes=/dashboard

            # Middleware: Authentication
            # Set TRAEFIK_DASHBOARD_AUTH in .env (generate with: htpasswd -nB admin)
            # SECURITY: never commit a real htpasswd hash to the repo.
            - traefik.http.middlewares.auth.basicauth.users=${TRAEFIK_DASHBOARD_AUTH:?Set TRAEFIK_DASHBOARD_AUTH in .env}
        networks:
            - default
        restart: unless-stopped

    db-schema:
        build:
            context: .
            dockerfile: ./python/worker/Dockerfile
        container_name: dcs-db-schema
        env_file:
            - ./.env.global
        environment:
            - DB_USER=${POSTGRES_USER}
            - DB_PASSWORD=${POSTGRES_PASSWORD}
            - DB_NAME=${POSTGRES_DB}
        depends_on:
            dcs-postgres:
                condition: service_healthy
        restart: "no"
        command: ["python", "-m", "shared.db.schema"]

    bot-api:
        build:
            context: .
            dockerfile: ./python/bot/Dockerfile
            args:
                BOT_REQUIREMENTS_FILE: requirements.api.txt
        container_name: dcs-bot-api
        env_file:
            - ./python/bot/.env
            - ./.env.global
        environment:
            - DB_USER=${POSTGRES_USER}
            - DB_PASSWORD=${POSTGRES_PASSWORD}
            - DB_NAME=${POSTGRES_DB}
            - BOT_RUNTIME_MODE=api
            - INTERNAL_API_TOKEN=${INTERNAL_API_TOKEN:?Set INTERNAL_API_TOKEN in .env}
        depends_on:
            dcs-postgres:
                condition: service_healthy
            db-schema:
                condition: service_completed_successfully
        restart: unless-stopped
        volumes:
            # Optional: mount local settings file for rapid iteration without rebuilding image
            - ./settings.default.jsonc:/app/settings.default.jsonc:ro
        ports:
            # Localhost only: the bot API proxies Discord REST with the bot token
            - "127.0.0.1:8000:8000"

    bot-discord:
        build:
            context: .
            dockerfile: ./python/bot/Dockerfile
            args:
                BOT_REQUIREMENTS_FILE: requirements.discord.txt
        container_name: dcs-bot-discord
        env_file:
            - ./python/bot/.env
            - ./.env.global
        environment:
            - DB_USER=${POSTGRES_USER}
            - DB_PASSWORD=${POSTGRES_PASSWORD}
            - DB_NAME=${POSTGRES_DB}
            - BOT_RUNTIME_MODE=discord
        depends_on:
            dcs-postgres:
                condition: service_healthy
            dcs-redis:
                condition: service_healthy
            db-schema:
                condition: service_completed_successfully
        restart: unless-stopped
        volumes:
            # Optional: mount local settings file for rapid iteration without rebuilding image
            - ./settings.default.jsonc:/app/settings.default.jsonc:ro

    worker:
        build:
            context: .
            dockerfile: ./python/worker/Dockerfile
        # No container_name - allows scaling with --scale worker=N
        env_file:
            - ./python/worker/.env
            - ./.env.global
        environment:
            - DB_USER=${POSTGRES_USER}
            - DB_PASSWORD=${POSTGRES_PASSWORD}
            - DB_NAME=${POSTGRES_DB}
            - WORKER_MODE=${WORKER_MODE:-all}
        depends_on:
            dcs-postgres:
                condition: service_healthy
            dcs-redis:
                condition: service_healthy
            db-schema:
                condition: service_completed_successfully
        restart: unless-stopped
        volumes:
            # Persist thumbnails in shared volume
            - worker_storage:/app/storage
        deploy:
            replicas: 1 # Default number of workers (change to 3 for testing, 5+ for production)

    interface:
        build:
            context: .
            dockerfile: ./interface/Dockerfile
        container_name: dcs-interface
        env_file:
            - ./interface/.env
            - ./.env.global
        environment:
            - BOT_API_URL=http://bot-api:8000
            - DB_USER=${POSTGRES_USER}
            - DB_PASSWORD=${POSTGRES_PASSWORD}
            - DB_NAME=${POSTGRES_DB}
            - INTERNAL_API_TOKEN=${INTERNAL_API_TOKEN:?Set INTERNAL_API_TOKEN in .env}
        depends_on:
            dcs-postgres:
                condition: service_healthy
            db-schema:
                condition: service_completed_successfully
        restart: unless-stopped
        volumes:
            # Optional: mount local settings file to the same in-container path used by the image
            - ./settings.default.jsonc:/app/settings.default.jsonc:ro
            # Share worker storage volume to serve thumbnails
            - worker_storage:/app/storage:ro
        labels:
            - traefik.enable=true
            # Service port inside the container
            - traefik.http.services.interface.loadbalancer.server.port=3000

            # Dev HTTP router for localhost (no TLS, dev only)
            - traefik.http.routers.interface-local.rule=Host(`localhost`) || Host(`127.0.0.1`)
            - traefik.http.routers.interface-local.entrypoints=web
            - traefik.http.routers.interface-local.priority=10
        ports:
            - "3000:3000"

    dcs-postgres:
        image: postgres:16-alpine
        container_name: dcs-postgres
        environment:
            POSTGRES_USER: ${POSTGRES_USER:-postgres}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
            POSTGRES_DB: ${POSTGRES_DB:-postgres}
        volumes:
            - postgres_data:/var/lib/postgresql/data
        ports:
            # Localhost only: never expose the database to the network
            - "127.0.0.1:5432:5432"
        networks:
            default:
                ipv4_address: 172.20.0.10
        restart: unless-stopped
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-postgres}"]
            interval: 5s
            timeout: 3s
            retries: 10

    dcs-redis:
        image: redis:7-alpine
        container_name: dcs-redis
        command: ["redis-server", "--save", "60", "1", "--loglevel", "warning"]
        volumes:
            - redis_data:/data
        ports:
            # Localhost only: Redis has no authentication configured
            - "127.0.0.1:6379:6379"
        networks:
            default:
                ipv4_address: 172.20.0.11
        restart: unless-stopped
        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            interval: 5s
            timeout: 3s
            retries: 10

    dozzle:
        image: amir20/dozzle:latest
        container_name: dcs-dozzle
        # SECURITY: no env_file here. Third-party images must not receive
        # BOT_TOKEN / client secrets / DB credentials.
        restart: unless-stopped
        volumes:
            - /var/run/docker.sock:/var/run/docker.sock:ro
        networks:
            - default
        ports:
            - "127.0.0.1:8088:8080" # Exposed locally at http://localhost:8088

    uptime-kuma:
        image: louislam/uptime-kuma:1
        container_name: dcs-uptime-kuma
        # SECURITY: no env_file here. Thi